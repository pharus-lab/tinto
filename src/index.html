<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tinto</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="spelling.css"><link rel="stylesheet" href="draft.css">
  <script defer src="app.js"></script>
</head>
<body class="welcome">
  <header class="titlebar">
    <span class="wordmark">Tinto<span>.</span></span>
    <nav id="tabs" aria-label="Open documents">
      <div class="tab" id="home-tab"><button type="button" title="Home" data-tab-key="home"><i data-icon="home"></i><span class="tab-label">Home</span></button></div>
      <div id="document-tabs"></div>
    </nav>
    <button id="settings" title="Reading and project settings" aria-label="Reading and project settings" ><i data-icon="settings"></i><span>Settings</span></button>
  </header>
  <div class="location">
    <div class="location-start">
      <button id="headings" popovertarget="heading-list" aria-label="Headings" title="Navigate headings" hidden><i data-icon="outline"></i><span>Headings</span><i class="down-chevron" data-icon="chev"></i></button>
      <nav id="trail" aria-label="Location"></nav>
    </div>
    <nav id="heading-list" aria-label="Manuscript headings" popover></nav>
    <div class="tools" id="document-tools">
      <button id="export" title="Export this document or section">Export</button>
      <button id="publish" title="Publish this document or section to a website">Publish</button>
      <button id="translate" title="Translate this document into another language"><i data-icon="globe"></i><span>Translate</span></button>
      <button id="draft-action"></button>
      <button id="history" aria-label="History" title="Version history"><i data-icon="clock"></i><span>History</span></button>
      <button id="toggle-alternatives" aria-controls="panel"><i data-icon="panel"></i>Alternatives</button>
    </div>
  </div>
  <main id="workspace">
    <section id="writing" aria-label="Writing area">
      <div id="toolbar" role="toolbar" aria-label="Manuscript formatting">
        <select id="block-style" aria-label="Paragraph style">
          <option value="paragraph">Paragraph</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option>
          <option value="h4">Heading 4</option><option value="h5">Heading 5</option><option value="h6">Heading 6</option>
        </select>
        <span class="tool-rule"></span>
        <button class="format bold" data-format="bold" aria-label="Bold" title="Bold">B</button>
        <button class="format italic" data-format="italic" aria-label="Italic" title="Italic">I</button>
        <button class="format" data-format="underline" aria-label="Underline" aria-keyshortcuts="Meta+U Control+U" title="Underline" data-icon="underline"></button>
        <button id="markdown" aria-pressed="false" title="Edit Markdown source">Markdown</button>
        <span class="tool-rule"></span>
        <button id="add-alternative" aria-label="Add alternative" title="Add alternative"><i data-icon="branch"></i><span>Add alternative</span></button>
        <button id="show-origins" class="icon-button" aria-pressed="false" aria-label="Show pasted and imported text" title="Show pasted and imported text" data-icon="origins"></button>
        <span class="tool-fill"></span>
        <button id="check-writing" aria-controls="panel" aria-expanded="false" title="Check this document or linked section">Check writing</button>
        <button id="undo" class="icon-button" aria-label="Undo" title="Undo" data-icon="undo"></button>
        <button id="redo" class="icon-button" aria-label="Redo" title="Redo" data-icon="redo"></button>
      </div>
      <div id="scroll"><div id="translation-note" class="translation-note" role="note" hidden></div><div id="editors"></div></div>
    </section>
    <aside id="panel" aria-label="Alternatives">
      <header class="panel-title"><h2 id="panel-title">Alternatives</h2><button id="close-panel" class="icon-button" title="Close alternatives" aria-label="Close alternatives" data-icon="close"></button></header>
      <div id="panel-tabs" role="tablist" aria-label="Sidebar views"><button id="panel-alternatives" role="tab" aria-selected="true" aria-controls="choices">Alternatives</button><button id="panel-writing" role="tab" aria-selected="false" aria-controls="writing-checks" tabindex="-1">Writing checks</button></div>
      <div id="choices" role="tabpanel" aria-labelledby="panel-alternatives"></div>
      <div id="writing-checks" role="tabpanel" aria-labelledby="panel-writing" hidden></div>
    </aside>
    <section id="home" aria-label="Home" hidden></section>
  </main>
  <footer>
    <span id="save-status" role="status"></span>
    <span id="word-count"></span><span class="tool-fill"></span>
    <label id="language-label"><i data-icon="globe"></i><select aria-label="Document spelling language" id="language"><option value="en">English</option><option value="es">Spanish</option></select></label>
  </footer>
  <div id="notice" role="status" hidden></div>
  <dialog id="modal" aria-labelledby="dialog-title"></dialog>
</body>
</html>
